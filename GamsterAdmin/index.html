<!DOCTYPE html>

<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Gamster Admin</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- ====================================== -->
    <!-- ÉCRAN DE CONNEXION -->
    <!-- ====================================== -->

    <div
        id="loginScreen"
        class="screen"
    >

        <div class="login-box">

            <div class="logo">
                G
            </div>

            <h1>
                Gamster Admin
            </h1>

            <p class="subtitle">
                Connexion administrateur
            </p>


            <label for="email">
                Adresse e-mail
            </label>

            <input
                id="email"
                type="email"
                placeholder="Ton adresse e-mail"
                autocomplete="email"
            >


            <label for="password">
                Mot de passe
            </label>

            <input
                id="password"
                type="password"
                placeholder="Ton mot de passe"
                autocomplete="current-password"
            >


            <button
                id="loginButton"
                class="primary-button"
            >
                Se connecter
            </button>


            <div
                id="loginError"
                class="error hidden"
            ></div>

        </div>

    </div>



    <!-- ====================================== -->
    <!-- PANNEAU ADMIN -->
    <!-- ====================================== -->

    <div
        id="adminScreen"
        class="admin-screen hidden"
    >


        <header class="topbar">

            <div class="brand">

                <div class="brand-logo">
                    G
                </div>

                <div>

                    <strong>
                        Gamster Admin
                    </strong>

                    <span>
                        Gestion des licences
                    </span>

                </div>

            </div>


            <button
                id="logoutButton"
                class="logout-button"
            >
                Se déconnecter
            </button>

        </header>



        <main class="content">


            <div class="page-header">

                <div>

                    <h2>
                        Licences
                    </h2>

                    <p>
                        Gestion de tes licences Gamster Bot
                    </p>

                </div>


                <div class="header-buttons">

                    <button
                        id="createLicenseButton"
                        class="primary-button small-button"
                    >
                        + Créer une licence
                    </button>

                    <button
                        id="refreshButton"
                        class="secondary-button"
                    >
                        Actualiser
                    </button>

                </div>

            </div>



            <div
                id="adminError"
                class="error hidden"
            ></div>



            <!-- ====================================== -->
            <!-- STATISTIQUES -->
            <!-- ====================================== -->

            <div class="stats">


                <div class="stat-card">

                    <span>
                        Total
                    </span>

                    <strong id="totalLicenses">
                        0
                    </strong>

                </div>


                <div class="stat-card">

                    <span>
                        Actives
                    </span>

                    <strong id="activeLicenses">
                        0
                    </strong>

                </div>


                <div class="stat-card">

                    <span>
                        Appareils liés
                    </span>

                    <strong id="linkedLicenses">
                        0
                    </strong>

                </div>


            </div>



            <!-- ====================================== -->
            <!-- TABLEAU -->
            <!-- ====================================== -->

            <div class="table-card">

                <div class="table-wrapper">

                    <table>

                        <thead>

                            <tr>

                                <th>
                                    Clé
                                </th>

                                <th>
                                    Propriétaire
                                </th>

                                <th>
                                    État
                                </th>

                                <th>
                                    Appareil
                                </th>

                                <th>
                                    Activation
                                </th>

                                <th>
                                    Notes
                                </th>

                                <th>
                                    Action
                                </th>

                            </tr>

                        </thead>


                        <tbody id="licensesTable">

                        </tbody>

                    </table>

                </div>

            </div>


        </main>

    </div>



    <!-- ====================================== -->
    <!-- FENÊTRE CRÉATION LICENCE -->
    <!-- ====================================== -->

    <div
        id="createLicenseModal"
        class="modal hidden"
    >

        <div class="modal-box">

            <h2>
                Créer une licence
            </h2>

            <p class="modal-description">
                Une nouvelle clé sera générée automatiquement.
            </p>


            <label for="licenseOwner">
                Propriétaire
            </label>

            <input
                id="licenseOwner"
                type="text"
                placeholder="Ex : Karim"
                autocomplete="off"
            >


            <label for="licenseNotes">
                Notes
            </label>

            <textarea
                id="licenseNotes"
                placeholder="Ex : Client Discord #1234"
            ></textarea>


            <div class="modal-buttons">

                <button
                    id="cancelCreateLicense"
                    class="secondary-button"
                >
                    Annuler
                </button>

                <button
                    id="confirmCreateLicense"
                    class="primary-button small-button"
                >
                    Créer
                </button>

            </div>


            <div
                id="createLicenseError"
                class="error hidden"
            ></div>

        </div>

    </div>



    <!-- ====================================== -->
    <!-- SUPABASE -->
    <!-- ====================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- ====================================== -->
    <!-- APPLICATION -->
    <!-- ====================================== -->

    <script src="app.js"></script>


</body>

</html>
